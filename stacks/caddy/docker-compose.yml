services:
  caddy:
    image: caddy:alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: business-caddy
    restart: unless-stopped
    ports:
      - "10.37.20.70:9443:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/appdata/caddy/data:/data
      - /opt/appdata/caddy/config:/config
    networks:
      - businessnet
    security_opt:
      - no-new-privileges:true

networks:
  businessnet:
    external: true
