# n8n — workflow automation (marketplace order ingestion, bank CSV import, LLM agents).
# Node.js/Postgres, host port 5678. Reverse-proxied via Caddy → n8n.pushprh.com.
# Reaches LiteLLM on epyc-server for inference via LAN (http://10.37.20.50:4000/v1).
services:
  n8n:
    image: ghcr.io/n8n-io/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_EDITOR_BASE_URL: "https://n8n.pushprh.com"
      N8N_HOST: "n8n.pushprh.com"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      N8N_SECURE_COOKIE: "true"
      N8N_DEFAULT_TIMEZONE: "America/Los_Angeles"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "n8n-db"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${N8N_DB_NAME}"
      DB_POSTGRESDB_USER: "${N8N_DB_USER}"
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_USER_MANAGEMENT_JWT_SECRET: "${N8N_JWT_SECRET}"
      N8N_USER_MANAGEMENT_MODE: "default"
      WEBHOOK_URL: "https://n8n.pushprh.com/"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_AI_ENABLED: "true"
      # Reaches LiteLLM on epyc-server over LAN — same as media VM cross-host calls
      N8N_LLM_PROVIDER_OPENAI_API_BASE: "http://10.37.20.50:4000/v1"
      N8N_LLM_PROVIDER_OPENAI_API_KEY: "${LITELLM_N8N_KEY}"
    volumes:
      - /opt/appdata/n8n:/home/node/.n8n
    ports:
      - "10.37.20.70:5678:5678"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - businessnet
    security_opt:
      - no-new-privileges:true

  n8n-db:
    image: postgres:17
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${N8N_DB_USER}"
      POSTGRES_PASSWORD: "${N8N_DB_PASSWORD}"
      POSTGRES_DB: "${N8N_DB_NAME}"
    volumes:
      - /opt/appdata/n8n/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - businessnet

networks:
  businessnet:
    external: true
