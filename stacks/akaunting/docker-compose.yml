# Akaunting — business accounting, invoicing, double-entry bookkeeping.
# Laravel/MariaDB behind business Caddy (forward_auth → Authelia) → accounts.pushprh.com.
services:
  akaunting:
    image: akaunting/akaunting:3.1.21
    container_name: akaunting
    restart: unless-stopped
    entrypoint: ["bash", "/akaunting-start.sh"]
    env_file: .env
    environment:
      APP_URL: "https://accounts.pushprh.com"
      DB_HOST: "akaunting-db"
      DB_NAME: "${AKAUNTING_DB_NAME}"
      DB_USERNAME: "${AKAUNTING_DB_USER}"
      DB_PASSWORD: "${AKAUNTING_DB_PASSWORD}"
      DB_PORT: "3306"
      APP_KEY: "${AKAUNTING_APP_KEY}"
      # --- Setup/Install ---
      AKAUNTING_SETUP: "false"
      COMPANY_NAME: "${COMPANY_NAME:-PK United}"
      COMPANY_EMAIL: "${COMPANY_EMAIL:-hpushpreet@gmail.com}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-hpushpreet@gmail.com}"
      LOCALE: "${LOCALE:-en-US}"
      DB_PREFIX: "${DB_PREFIX:-3di_}"
    volumes:
      - ./akaunting-start.sh:/akaunting-start.sh:ro
      - /opt/appdata/akaunting/storage:/var/www/html/storage
    depends_on:
      akaunting-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -4 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/ | grep -qE '^(2|3|4)[0-9]{2}$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - businessnet
    security_opt:
      - no-new-privileges:true

  akaunting-db:
    image: mariadb:11.3
    container_name: akaunting-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${AKAUNTING_DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${AKAUNTING_DB_NAME}"
      MYSQL_USER: "${AKAUNTING_DB_USER}"
      MYSQL_PASSWORD: "${AKAUNTING_DB_PASSWORD}"
    volumes:
      - /opt/appdata/akaunting/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - businessnet

networks:
  businessnet:
    external: true
